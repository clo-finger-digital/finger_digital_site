<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINGER DIGITAL | Services</title>
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/icon-192.png">

  <style>
    :root {
      --brand-green: #8AD621;
      --brand-green-hover: #21870A;
      --brand-dark: #162E1C;
      --bg-light: #F9F9F9;
      --bg-white: #FFFFFF;
      --text-main: #333333;
      --text-muted: #666666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { height: 100%; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-white);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal-node {
      animation: fadeInUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #EEEEEE;
    }
    .brand-link { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-logo { height: 42px; width: auto; display: block; object-fit: contain; }
    nav { display: flex; align-items: center; }
    nav a {
      text-decoration: none;
      color: var(--brand-dark);
      font-weight: 600;
      font-size: 0.9rem;
      margin-left: 35px;
      position: relative;
      transition: color 0.2s ease;
    }
    nav a.active { color: var(--brand-green-hover); }
    nav a.active::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background-color: var(--brand-green-hover); }
    nav a:hover { color: var(--brand-green-hover); }

    @media (max-width: 768px) {
      header { padding: 15px 24px; }
      nav a { margin-left: 20px; font-size: 0.85rem; }
      .brand-logo { height: 32px; }
    }

    /* Mobile Nav Fix */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      .brand-link span { display: none; }
      nav a { margin-left: 12px; font-size: 0.8rem; }
      nav { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    }
    
    footer { 
      background-color: var(--brand-dark); 
      color: #FFFFFF; 
      padding: 80px 50px; 
      flex-shrink: 0;
    }
    .footer-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 40px; }
    .footer-left { display: flex; flex-direction: column; gap: 25px; }
    .footer-logo { height: 42px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); }
    .footer-left h3 { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; }
    .footer-left p { color: #BBBBBB; max-width: 400px; }
    .footer-right { display: flex; gap: 60px; }
    .footer-col h5 { font-size: 0.85rem; text-transform: uppercase; color: var(--brand-green); margin-bottom: 15px; }
    .footer-col p { font-size: 0.95rem; color: #BBBBBB; line-height: 1.8; }
    @media (max-width: 768px) { footer { padding: 60px 24px; } }
  </style>
</head>
<body>

  <header class="reveal-node">
    <a href="/index.html" class="brand-link">
      <img class="brand-logo" src="/logo.png" alt="Finger Digital Logo">
      <span style="font-family: inherit; font-size: 1.25rem; font-weight: 900; color: #162E1C; letter-spacing: 1.5px; text-transform: uppercase;">FINGER DIGITAL</span>
    </a>
    <nav>
      <a href="/index.html">Home</a>
      <a href="/services.html" class="active">Services</a>
      <a href="/about.html">About Us</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </header>

  <!-- Your Services Content -->

  <footer class="reveal-node delay-2">
    <div class="footer-content">
      <div class="footer-left">
        <img class="footer-logo" src="/logo.png" alt="Finger Digital Logo">
        <h3>Let's level up.</h3>
        <p>Ready to structurally convert your technical vision into scalable web infrastructure?</p>
      </div>
      <div class="footer-right">
        <div class="footer-col">
          <h5>Inquiries</h5>
          <p>sales@finger-digital.com</p>
        </div>
        <div class="footer-col">
          <h5>Studio</h5>
          <p>
            <strong>Finger Digital Limited</strong><br>
            Unit 2305, 23/F, Tower 2,<br>
            Metroplaza, 223 Hing Fong Road,<br>
            Kwai Fong, N.T., H.K.
          </p>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
